;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
	olikraus/U8g2@^2.35.4
	NimBLE-Arduino
	https://github.com/larryli/u8g2_wqy.git
	adafruit/Adafruit BusIO@^1.16.1
	; The Edge Impulse model library is manually extracted to lib/ESP32-AS7343_Decoder_3class_inferencing/;
	; do not also reference the zip, to avoid duplicate library names.
	; ./lib/ei-esp32-as7343-decoder-3class-arduino-1.0.4-raw-dense-7ea.zip